<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Méthodes</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Carte et panier</h1>

  <article class="card">
    <h2>App resto</h2>
    <p id="summary" class="muted"></p>
    <button id="like">J'aime</button>
  </article>

  <section class="card">
    <h2>Panier</h2>
    <div class="buttons">
      <button id="add-poster">Poster A3 · 24,90 €</button>
      <button id="add-tote">Tote bag · 12,50 €</button>
      <button id="clear">Vider</button>
    </div>
    <ul id="cart-list"></ul>
    <p id="cart-total" class="muted">Panier vide</p>
  </section>
</body>
</html>
