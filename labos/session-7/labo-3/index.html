<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Le hasard du designer</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Le hasard du designer</h1>

  <section class="grid">
    <article class="card">
      <h2>Le dé</h2>
      <p id="dice" class="dice">?</p>
      <button id="roll">Lancer le dé</button>
      <p id="history" class="muted"></p>
    </article>

    <article class="card">
      <h2>La couleur</h2>
      <div id="swatch" class="swatch"><span id="color-code">—</span></div>
      <button id="pick">Couleur de la palette</button>
      <button id="random">Couleur au hasard</button>
    </article>
  </section>
</body>
</html>
