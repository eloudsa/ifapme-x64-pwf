<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rapport de la boutique</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Rapport de la boutique</h1>
  <p class="muted">L'atelier du designer · stock du jour</p>

  <section class="card">
    <h2>Catalogue</h2>
    <ul id="catalog" class="catalog"></ul>
  </section>

  <section class="card">
    <h2>Indicateurs</h2>
    <p id="stock-value"></p>
    <p id="out-of-stock"></p>
    <p id="priciest"></p>
  </section>

  <section class="card">
    <h2>Stock par produit</h2>
    <div id="chart"></div>
  </section>
</body>
</html>
