<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Moodboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Moodboard</h1>

  <div class="likes">
    <button id="like">J'aime</button>
    <span id="likes">0 like</span>
  </div>

  <h2>Palette</h2>
  <ul id="palette" class="palette"></ul>

  <h2>Aperçu</h2>
  <div class="colors">
    <button class="color">#4A72B8</button>
    <button class="color">#F2994A</button>
    <button class="color">#2E9E5B</button>
    <button class="color">#7C3AED</button>
  </div>
  <div id="preview" class="preview">Cliquez sur une couleur</div>
</body>
</html>
