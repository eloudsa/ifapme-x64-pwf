<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Studio Pixel</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Studio Pixel</h1>
  <p id="message" class="message">Choisissez un membre de l'équipe</p>

  <div class="buttons">
    <button id="sara">Sara</button>
    <button id="tom">Tom</button>
    <button id="lea">Léa</button>
    <button id="guest">Invité</button>
  </div>

  <article id="card" class="card profile">
    <h2 id="card-name">Votre nom</h2>
    <p id="card-role" class="muted">Rôle : à définir</p>
  </article>

  <div class="buttons">
    <button id="theme">Mode sombre</button>
    <button id="reset">Réinitialiser</button>
  </div>
</body>
</html>
