<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contrôleur de contraste</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Contrôleur de contraste</h1>
  <p class="muted">Vérifiez un texte selon les règles WCAG (niveaux AA et AAA).</p>

  <section class="card">
    <label>Taille du texte (px) <input id="size" type="number" placeholder="16"></label>
    <label><input id="bold" type="checkbox"> Texte en gras</label>
    <label>Ratio de contraste <input id="ratio" type="text" inputmode="decimal" placeholder="4.5"></label>
    <label>Composant
      <select id="component">
        <option value="body">body</option>
        <option value="button">button</option>
        <option value="placeholder">placeholder</option>
        <option value="logo">logo</option>
      </select>
    </label>
    <button id="check">Contrôler</button>
  </section>

  <section class="card">
    <p id="sample" class="sample">Le design, c'est aussi pour être lu.</p>
    <p id="badge" class="badge">En attente</p>
    <p id="report" class="muted"></p>
  </section>
</body>
</html>
