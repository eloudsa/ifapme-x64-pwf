<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon espace</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>Mon espace</h1>
    <button id="theme">Mode sombre</button>
  </header>

  <section class="card">
    <h2>Commande n° 1042</h2>
    <p class="muted">Statut envoyé par l'atelier (simulation)</p>
    <select id="status">
      <option value="received">received</option>
      <option value="printing">printing</option>
      <option value="shipped">shipped</option>
      <option value="delivered">delivered</option>
      <option value="cancelled">cancelled</option>
      <option value="refunded">refunded</option>
    </select>
    <button id="show">Afficher le statut</button>
    <div class="meter"><div id="bar" class="bar"></div></div>
    <p id="order-status" class="badge">Choisissez un statut</p>
  </section>
</body>
</html>
