<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma liste d'envies</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Ma liste d'envies</h1>
  <p id="count" class="muted"></p>
  <p id="first"></p>
  <p id="last"></p>

  <ul id="list" class="card list"></ul>

  <div class="toolbar">
    <input id="wish" type="text" placeholder="Une nouvelle envie">
    <button id="replace">Remplacer la première</button>
  </div>
  <p id="message" class="message"></p>
</body>
</html>
