<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma palette</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Ma palette</h1>
  <p class="muted">Couleurs principales : <span id="main"></span></p>

  <div id="palette" class="palette"></div>

  <div class="toolbar">
    <input id="color" type="text" placeholder="#16A085">
    <button id="add">Ajouter</button>
    <button id="favorite">Mettre en tête</button>
    <button id="remove">Retirer</button>
  </div>
  <p id="message" class="message"></p>
</body>
</html>
