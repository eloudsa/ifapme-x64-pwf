<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Les tags du projet</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>App resto</h1>
  <p class="muted">Les tags du projet</p>

  <div class="toolbar">
    <input id="tag" type="text" placeholder="Nouveau tag">
    <button id="add">Ajouter à la fin</button>
    <button id="add-first">Ajouter au début</button>
  </div>
  <div class="toolbar">
    <button id="remove-last">Retirer le dernier</button>
    <button id="remove-first">Retirer le premier</button>
  </div>

  <ul id="tags" class="tags"></ul>
  <p id="count" class="muted"></p>
  <p id="message" class="message"></p>
</body>
</html>
