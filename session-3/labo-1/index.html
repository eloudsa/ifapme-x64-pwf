<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma carte de visite</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="card business">
    <h1 id="name">Prénom Nom</h1>
    <p id="job" class="muted">Métier</p>
    <p id="city">Ville</p>
    <p id="email">adresse e-mail</p>
    <p><span id="projects">0</span> projets réalisés</p>
    <p id="summary" class="muted"></p>
    <div class="palette">
      <p>Couleur principale : <span id="primary">?</span></p>
      <p>Couleur secondaire : <span id="secondary">?</span></p>
    </div>
  </main>
</body>
</html>
